pagination:
  style: offset
  param: skip
  notes: >-
    The entity search (GET /v1/poi) supports pagination via the `skip`
    parameter; the first 1000 matching entities are available.
async_processing:
  pattern: cache-then-retry
  in_progress_status: 202
  in_progress_code: 3005
  notes: >-
    Report endpoints are cached. If a report is already cached it is returned
    immediately; otherwise the API returns HTTP 202 (IN_PROGRESS / code 3005)
    and the identical request must be re-sent until the report is ready.
    Processing-time estimates per endpoint are published at
    https://docs.placer.ai/reference/measurements.
idempotency:
  supported: false
  notes: Placer does not document an idempotency-key mechanism.
