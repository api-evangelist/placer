aid: placer
name: Placer
description: >-
  Placer.ai is a location analytics and foot-traffic intelligence platform that
  measures visits, trade areas, demographics, and consumer behavior for physical
  points of interest across retail, CPG, commercial real estate, hospitality,
  and the public sector. Its public developer surface, the Placer API (PAPI, base
  https://papi.placer.ai), lets developers and data analysts extract Placer's
  location analytics programmatically to enrich, filter, or combine it with other
  data sources for custom dashboards, internal reporting, and competitive
  analysis. The v1 REST API covers entity/POI search, custom POI and tag
  management, and a suite of report endpoints spanning visit metrics and trends,
  trade area (true trade area, drive-time, demographics), ranking, loyalty, and
  retail sales. Authentication is a static API key sent in the x-api-key header.
